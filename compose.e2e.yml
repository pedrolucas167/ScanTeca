services:
  database:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:55439:5432"
    environment:
      POSTGRES_USER: scanteca_test
      POSTGRES_PASSWORD: scanteca_test_local
      POSTGRES_DB: scanteca_reading_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanteca_test -d scanteca_reading_test"]
      interval: 3s
      timeout: 3s
      retries: 15
