name: scanteca

services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scanteca_dev
      POSTGRES_PASSWORD: scanteca_dev_local
      POSTGRES_DB: scanteca_container_dev
    volumes:
      - container_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U scanteca_dev -d scanteca_container_dev]
      interval: 3s
      timeout: 3s
      retries: 20
  prepare:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: tools
    environment:
      DATABASE_URL: postgresql://scanteca_dev:scanteca_dev_local@database:5432/scanteca_container_dev
    depends_on:
      database:
        condition: service_healthy
  app:
    image: scanteca-container:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Configure a chave publica de desenvolvimento}
    env_file: ../.env.container.local
    environment:
      DATABASE_URL: postgresql://scanteca_dev:scanteca_dev_local@database:5432/scanteca_container_dev
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      prepare:
        condition: service_completed_successfully
volumes:
  container_database:
