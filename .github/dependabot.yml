version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    # The current typescript-eslint parser supports TypeScript <6.1.
    # Review the complete toolchain before widening this range.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      vitest:
        patterns: [vitest, '@vitest/*', jsdom]
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(actions)
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(docker)
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /tools/lighthouse
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(performance)
