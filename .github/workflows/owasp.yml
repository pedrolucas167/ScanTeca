name: OWASP Dependency-Check (informational)

on:
  pull_request:
    paths:
      - '.github/workflows/owasp.yml'
      - '.github/dependency-check-suppressions.xml'
      - 'scripts/owasp-*.mjs'
      - 'scripts/run-owasp.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: owasp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: node --test scripts/owasp-policy.test.mjs
      - name: Restore vulnerability database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/security/owasp-data-v13
          key: ${{ runner.os }}-owasp-v13-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-owasp-v13-
      - name: Run scanner and verify reports
        id: scanner
        run: node scripts/run-owasp.mjs
      - name: Save successfully updated vulnerability database
        if: always() && steps.scanner.outputs.database-ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/security/owasp-data-v13
          key: ${{ runner.os }}-owasp-v13-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: owasp-dependency-check
          path: reports/security/owasp
          if-no-files-found: error
          retention-days: 14
