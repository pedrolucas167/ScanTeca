name: OWASP Dependency-Check (informational)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run OWASP Dependency-Check
        run: |
          mkdir -p reports/security/owasp
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            owasp/dependency-check:12.1.0 \
            --project "ScanTeca" \
            --scan /src \
            --out /src/reports/security/owasp \
            --suppression /src/.github/dependency-check-suppressions.xml \
            --format ALL \
            --failOnCVSS 11

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: owasp-dependency-check
          path: reports/security/owasp
          if-no-files-found: error
          retention-days: 14
