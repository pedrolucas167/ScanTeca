name: CI

permissions:
  contents: read
  actions: read

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  reading-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scanteca_test
          POSTGRES_PASSWORD: scanteca_test_local
          POSTGRES_DB: scanteca_reading_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U scanteca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCANTECA_TEST_REDIS: 127.0.0.1:56379
      DATABASE_URL: postgresql://scanteca_test:scanteca_test_local@127.0.0.1:55439/scanteca_reading_test
      SCANTECA_TEST_DATABASE_URL: postgresql://scanteca_test:scanteca_test_local@127.0.0.1:55439/scanteca_reading_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npm run test:integration:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-integration
          path: coverage/integration/coverage-final.json
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:coverage-tools
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit
          path: coverage/unit/coverage-final.json
          if-no-files-found: error
          retention-days: 14

      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/scanteca
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_dummy

  coverage:
    needs: [build, reading-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage/unit
      - uses: actions/download-artifact@v8
        with:
          name: coverage-integration
          path: coverage/integration
      - run: npm run coverage:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/combined
          if-no-files-found: error
          retention-days: 14
