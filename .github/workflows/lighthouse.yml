name: Public performance baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'modules/**'
      - 'public/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'Dockerfile'
      - 'next.config.ts'
      - 'middleware.ts'
      - 'compose*.yml'
      - 'package*.json'
      - 'scripts/*lighthouse*'
      - 'scripts/e2e-clerk-keys.mjs'
      - 'scripts/prepare-container-database.mjs'
      - 'tools/lighthouse/**'
      - '.github/workflows/lighthouse.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'modules/**'
      - 'public/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'Dockerfile'
      - 'next.config.ts'
      - 'middleware.ts'
      - 'compose*.yml'
      - 'package*.json'
      - 'scripts/*lighthouse*'
      - 'scripts/e2e-clerk-keys.mjs'
      - 'scripts/prepare-container-database.mjs'
      - 'tools/lighthouse/**'
      - '.github/workflows/lighthouse.yml'
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  report-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/lighthouse-policy.test.mjs
  lighthouse:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: report-policy
    environment: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lighthouse/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/lighthouse --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Measure signed-out public pages in disposable environment
        run: node scripts/run-lighthouse.mjs
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-public-metrics
          path: |
            reports/lighthouse/public/metrics.json
            reports/lighthouse/public/summary.md
          retention-days: 7
          if-no-files-found: warn
