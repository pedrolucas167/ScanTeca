<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Scanteca</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #fafafa;
        color: #18181b;
        padding: 1rem;
      }
      .card {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.6;
        color: #52525b;
        margin: 0 0 1.5rem;
      }
      button {
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 9999px;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
          color: #fafafa;
        }
        p {
          color: #a1a1aa;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Você está offline</h1>
      <p>
        O Scanteca precisa de conexão para carregar esta página. Páginas que
        você já visitou continuam disponíveis.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
